services:
  - type: web
    name: student-tp-evaluation-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn student_app.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MAX_DAILY_ATTEMPTS
        value: "50"
